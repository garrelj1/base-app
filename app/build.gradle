plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    buildToolsVersion = "34.0.0"

    defaultConfig {
        applicationId "com.garrell.co.apptemplate"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.garrell.co.baseapp'
}

dependencies {

    // Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Multithreading
    implementation 'com.techyourchance:threadposter:1.0.1'

    // Logging
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // event bus
    implementation 'org.greenrobot:eventbus:3.1.1'

    // dialogs
    implementation 'com.techyourchance:dialoghelper:1.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.5+'
    implementation 'androidx.navigation:navigation-ui:2.5+'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}